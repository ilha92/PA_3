name: pa3

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-replay}
      POSTGRES_USER: ${DB_USERNAME:-replay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replay}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
      - '${POSTGRES_PORT:-5436}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-replay} -d ${DB_DATABASE:-replay}']
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    # La connexion PostgreSQL utilise les mêmes variables que le fichier .env racine.
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-replay}
      DB_USERNAME: ${DB_USERNAME:-replay}
      DB_PASSWORD: ${DB_PASSWORD:-replay}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./backend:/app
      - ./.env:/app/.env
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
      # Les volumes montes n'emettent pas d'evenements fichier sur macOS et Windows.
      VITE_USE_POLLING: '1'
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    ports:
      - '${FRONTEND_PORT:-5173}:5173'

volumes:
  db-data:
  frontend-modules:
